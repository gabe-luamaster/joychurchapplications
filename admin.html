<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JCI Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
    font-family:"Montserrat",sans-serif;
    background: linear-gradient(135deg,#0f172a,#1e40af);
    min-height:100vh;
    padding:20px;
    color:white;
}
.container{
    max-width:1000px;
    margin:auto;
}
.card{
    background:white;
    color:black;
    border-radius:18px;
    padding:30px;
    margin-bottom:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}
input,select,button{
    padding:12px 10px;
    border-radius:10px;
    border:1px solid #2563eb;
    font-size:15px;
}
button{
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}
button:hover{
    opacity:.9;
}
button.approve{background:#14b8a6;color:white;}
button.deny{background:#ef4444;color:white;}
button.logout{background:#1e3a8a;color:white;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px;border:1px solid #ddd;text-align:left;}
th{background:#2563eb;color:white;}
</style>
</head>
<body>

<div class="container">

<!-- PASSCODE LOGIN -->
<div id="loginCard" class="card">
    <h1 class="text-2xl font-bold mb-4">Admin Login</h1>
    <input type="password" id="passcode" placeholder="Enter passcode" class="w-full mb-3">
    <button onclick="login()" class="w-full">Login</button>
    <p id="loginError" class="text-red-500 mt-2 hidden">Incorrect passcode!</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
    <button onclick="logout()" class="logout">Logout</button>
    <h1 class="text-2xl font-bold mb-4">Submitted Applications</h1>

    <label>Filter by Team:</label>
    <select id="teamFilter" class="mb-4" onchange="renderTable()">
        <option value="all">All Teams</option>
    </select>

    <table id="appsTable">
        <thead>
            <tr>
                <th>Team</th>
                <th>Name</th>
                <th>Roblox</th>
                <th>Discord</th>
                <th>Attendance</th>
                <th>Qualifications</th>
                <th>Extra Qs</th>
                <th>Agreements</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
const PASSCODE = "gabr123"; // CHANGE THIS TO YOUR SECRET
let applications = []; // merged list

function login(){
    const input = document.getElementById("passcode").value;
    if(input === PASSCODE){
        document.getElementById("loginCard").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        loadApplications();
    } else {
        document.getElementById("loginError").classList.remove("hidden");
    }
}

function logout(){
    document.getElementById("loginCard").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");
}

/* LOCAL STORAGE SAVE */
function saveApplication(app){
    let apps = JSON.parse(localStorage.getItem("jciApps")||"[]");
    apps.push(app);
    localStorage.setItem("jciApps", JSON.stringify(apps));
}

/* FETCH FROM NPOINT & MERGE WITH LOCAL */
async function loadApplications(){
    try {
        const res = await fetch('https://api.npoint.io/8c134d701d74f33e8026');
        const npointData = await res.json();

        const localApps = JSON.parse(localStorage.getItem("jciApps")||"[]");

        // merge nPoint + local apps
        applications = [...npointData, ...localApps];

        populateTeams();
        renderTable();
    } catch(err){
        alert("Failed to load applications from nPoint.");
        console.error(err);
    }
}

function populateTeams(){
    const teamFilter = document.getElementById("teamFilter");
    const teams = [...new Set(applications.map(a=>a.team).filter(Boolean))];
    teamFilter.innerHTML = '<option value="all">All Teams</option>'+teams.map(t=>`<option value="${t}">${t}</option>`).join("");
}

/* RENDER TABLE */
function renderTable(){
    const filter = document.getElementById("teamFilter").value;
    const tbody = document.querySelector("#appsTable tbody");
    tbody.innerHTML = "";

    applications.forEach((a,index)=>{
        if(filter !== "all" && a.team!==filter) return;
        const agreements = `TOS:${a.agreements.TOS}, Comfort:${a.agreements.comfort}, Training:${a.agreements.training}, Admin:${a.agreements.adminAbuse}`;
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${a.team}</td>
            <td>${a.preferredName}</td>
            <td>${a.roblox}</td>
            <td>${a.discord}</td>
            <td>${a.scale}</td>
            <td>${a.qualified}</td>
            <td>${a.extra}</td>
            <td>${agreements}</td>
            <td>${a.status||'Pending'}</td>
            <td>
                <button class="approve" onclick="approve(${index})">✔</button>
                <button class="deny" onclick="deny(${index})">✖</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

/* APPROVE/DENY */
function approve(index){
    applications[index].status = "Approved";
    saveToLocal();
    renderTable();
}

function deny(index){
    applications[index].status = "Denied";
    saveToLocal();
    renderTable();
}

function saveToLocal(){
    // save only the local apps back
    const npointData = applications.filter(a => !a.submittedAt.startsWith("2026")); // example: nPoint apps
    const localApps = applications.filter(a => a.submittedAt && a.submittedAt.startsWith("2026")); // assume new local apps
    localStorage.setItem("jciApps", JSON.stringify(localApps));
}
</script>

</body>
</html>
