<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>JCI Application</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    font-family: "Montserrat", sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e40af);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* CARD */
.container {
    width: 100%;
    max-width: 700px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 35px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, .4);
}

/* INPUTS & TEXTAREAS */
input, textarea, select {
    width: 100%;
    padding: 16px 16px !important;
    border-radius: 10px !important;
    border: 1px solid #2563eb;
    font-size: 16px !important;
    height: 50px;
    background: #f0f4ff;
    transition: .25s;
}

textarea {
    height: 120px;
    resize: vertical;
}

input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #00e5ff;
    box-shadow: 0 0 10px rgba(0, 229, 255, .4);
}

/* BUTTONS */
button {
    padding: 12px 0 !important;
    font-size: 15px !important;
    border-radius: 10px !important;
    font-weight: 600;
    transition: .2s;
}

button.next {
    background-color: #00e5ff;
    color: black;
}

button.back {
    background-color: #1e3a8a;
    color: white;
}

/* SCALE (1-10) */
.scale {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
    margin-top: 8px;
}

.scale label {
    background: #f0f4ff;
    padding: 10px 0;
    border-radius: 6px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}

.scale label:hover {
    background: #dbeafe;
}

/* SUCCESS POPUP */
.success {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, .65);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: .3s;
}

.success.show {
    opacity: 1;
    pointer-events: auto;
}

.successBox {
    background: white;
    padding: 40px;
    border-radius: 18px;
    text-align: center;
    animation: pop .4s ease;
}

@keyframes pop {
    from {
        transform: scale(.6);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}
</style>

</head>

<body>

<div class="container">
    <div class="card">

        <h1 id="teamTitle" class="text-2xl font-bold mb-4"></h1>

        <div class="progress">
            <div id="progressBar" class="h-2 w-1/3 bg-cyan-400 rounded"></div>
        </div>

        <div class="overflow-hidden">
            <div id="slider" class="flex transition-transform duration-500">

                <!-- PAGE 1 -->
                <div class="page w-full flex flex-col space-y-4">
                    <h2 class="font-semibold text-lg">Personal Preferences</h2>

                    <input placeholder="Preferred Name">

                    <select>
                        <option>Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Prefer not to say</option>
                    </select>

                    <input placeholder="Roblox Username (ex: @gabriel_lovesjesus)">
                    <input placeholder="Discord Username (ex: @gabriel_lovesjesus)">

                    <button type="button" onclick="nextPage()" class="next">
                        Next
                    </button>
                </div>

                <!-- PAGE 2 -->
                <div class="page w-full flex flex-col space-y-4">
                    <h2 class="font-semibold text-lg">Main Form</h2>

                    <p class="text-sm">How likely are you able to attend service (1-10)?</p>
                    <div class="scale">
                        <label>1<input type="radio" name="scale"></label>
                        <label>2<input type="radio" name="scale"></label>
                        <label>3<input type="radio" name="scale"></label>
                        <label>4<input type="radio" name="scale"></label>
                        <label>5<input type="radio" name="scale"></label>
                        <label>6<input type="radio" name="scale"></label>
                        <label>7<input type="radio" name="scale"></label>
                        <label>8<input type="radio" name="scale"></label>
                        <label>9<input type="radio" name="scale"></label>
                        <label>10<input type="radio" name="scale"></label>
                    </div>

                    <textarea placeholder="Tell us why you feel qualified for this role (2-7 sentences)"></textarea>
                    <textarea placeholder="List all reasons you may not attend service"></textarea>

                    <div id="extraQuestions"></div>

                    <div class="flex gap-3">
                        <button type="button" onclick="prevPage()" class="back">Back</button>
                        <button type="button" onclick="nextPage()" class="next">Next</button>
                    </div>
                </div>

                <!-- PAGE 3 -->
                <div class="page w-full flex flex-col space-y-4">
                    <h2 class="font-semibold text-lg">Agreements</h2>

                    <label>Agree not to abuse admin?</label>
                    <select>
                        <option>Yes</option>
                        <option>No</option>
                        <option>Maybe</option>
                    </select>

                    <label>Comfortable working alone or with others?</label>
                    <select>
                        <option>Yes</option>
                        <option>No</option>
                        <option>Maybe</option>
                    </select>

                    <label>Will attend mandatory training?</label>
                    <select>
                        <option>Yes</option>
                        <option>No</option>
                        <option>Maybe</option>
                    </select>

                    <label>Agree with JCI, Roblox, Discord TOS?</label>
                    <select>
                        <option>Yes</option>
                        <option>No</option>
                        <option>Maybe</option>
                    </select>

                    <div class="flex gap-3">
                        <button type="button" onclick="prevPage()" class="back">Back</button>
                        <button type="button" onclick="submitForm()" class="next">Submit</button>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<div id="success" class="success">
    <div class="successBox">
        <div class="text-4xl mb-2">✔</div>
        <h2 class="font-bold">Application Submitted</h2>
        <p class="text-gray-600 text-sm">Please allow up to 72 hours for review</p>
    </div>
</div>

<script>
let page = 0
const slider = document.getElementById("slider")
const progress = document.getElementById("progressBar")

function update() {
    slider.style.transform = `translateX(-${page * 100}%)`
    progress.style.width = `${(page + 1) * 33}%`
}

function nextPage() {
    if (page < 2) {
        page++
        update()
    }
}

function prevPage() {
    if (page > 0) {
        page--
        update()
    }
}

function submitForm() {
    document.getElementById("success").classList.add("show")
}

// Extra team-specific questions
const params = new URLSearchParams(window.location.search)
const team = (params.get("team") || "").toLowerCase()
document.getElementById("teamTitle").textContent = params.get("team") + " Application"

const extra = document.getElementById("extraQuestions")
if (team.includes("security")) {
    extra.innerHTML = `<textarea placeholder="How would you handle a disruptive player during service?"></textarea>`
}
if (team.includes("worship")) {
    extra.innerHTML = `<input placeholder="What instrument or worship role do you serve?">`
}
if (team.includes("production")) {
    extra.innerHTML = `<input placeholder="What production software do you use?">`
}
if (team.includes("creative")) {
    extra.innerHTML = `<textarea placeholder="Describe your building/design experience"></textarea>`
}
</script>

</body>
</html>
