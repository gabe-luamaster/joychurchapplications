<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Application</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 p-10">

<div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow">

<h1 id="teamTitle"
class="text-2xl font-bold mb-6"></h1>

<form class="space-y-4">

<input placeholder="Preferred Name"
class="border p-2 w-full rounded">

<input placeholder="Roblox Username"
class="border p-2 w-full rounded">

<input placeholder="Discord Username"
class="border p-2 w-full rounded">

<textarea placeholder="Why are you qualified?"
class="border p-2 w-full rounded"></textarea>

<div id="extraQuestions"></div>

<button class="bg-black text-white px-6 py-3 rounded">
Submit Application
</button>

</form>

</div>

<script>

const params = new URLSearchParams(window.location.search)
const team = params.get("team")

document.getElementById("teamTitle").textContent =
team + " Application"

const extra = document.getElementById("extraQuestions")

if(team==="Security Team"){

extra.innerHTML=`
<textarea placeholder="How would you handle a disruptive player?"
class="border p-2 w-full rounded"></textarea>
`

}

if(team==="Worship Team"){

extra.innerHTML=`
<input placeholder="What instrument or role do you serve?"
class="border p-2 w-full rounded">
`

}

if(team==="Production Team"){

extra.innerHTML=`
<input placeholder="What production software do you use?"
class="border p-2 w-full rounded">
`

}

if(team==="Creative Department"){

extra.innerHTML=`
<textarea placeholder="What building or design experience do you have?"
class="border p-2 w-full rounded"></textarea>
`

}

</script>

</body>
</html>
