<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>JCI Application</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
font-family:"Montserrat",sans-serif;
background:linear-gradient(135deg,#0f172a,#1e40af);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.container{width:100%;max-width:700px;}

.card{
background:white;
border-radius:18px;
padding:35px;
box-shadow:0 25px 60px rgba(0,0,0,.4);
}

input,textarea,select{
width:100%;
padding:16px;
border-radius:10px;
border:1px solid #2563eb;
font-size:16px;
height:50px;
background:#f0f4ff;
transition:.25s;
}

textarea{
height:120px;
resize:vertical;
}

input:focus,textarea:focus,select:focus{
outline:none;
border-color:#14b8a6;
box-shadow:0 0 10px rgba(20,184,166,.35);
}

button{
padding:12px 0;
font-size:15px;
border-radius:10px;
font-weight:600;
transition:.2s;
cursor:pointer;
}

button.next{background:#14b8a6;color:white;}
button.back{background:#1e3a8a;color:white;}

.page{min-width:100%;flex:0 0 100%;}

.scale{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:8px;
}

.scaleItem{
background:#f0f4ff;
padding:12px 0;
border-radius:8px;
text-align:center;
cursor:pointer;
font-weight:600;
border:1px solid #2563eb;
}

.scaleItem input{display:none;}

.scaleItem.selected{
background:#14b8a6;
border-color:#14b8a6;
color:white;
}

.success{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:.3s;
}

.success.show{
opacity:1;
pointer-events:auto;
}

.successBox{
background:white;
padding:40px;
border-radius:18px;
text-align:center;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1 id="teamTitle" class="text-2xl font-bold mb-4"></h1>

<div class="progress mb-4">
<div id="progressBar" class="h-2 w-1/3 bg-cyan-400 rounded"></div>
</div>

<div class="overflow-hidden">
<div id="slider" class="flex transition-transform duration-500">

<!-- PAGE 1 -->
<div class="page flex flex-col space-y-4">

<h2 class="font-semibold text-lg">Personal Preferences</h2>

<input id="preferredName" placeholder="Preferred Name">

<select id="gender">
<option>Gender</option>
<option>Male</option>
<option>Female</option>
<option>Prefer not to say</option>
</select>

<input id="roblox" placeholder="Roblox Username">

<input id="discord" placeholder="Discord Username">

<button type="button" onclick="nextPage()" class="next">Next</button>

</div>

<!-- PAGE 2 -->
<div class="page flex flex-col space-y-4">

<h2 class="font-semibold text-lg">Main Form</h2>

<p class="text-sm">How likely are you able to attend service (1-10)?</p>

<div class="scale">

<label class="scaleItem"><input type="radio" name="scale" value="1">1</label>
<label class="scaleItem"><input type="radio" name="scale" value="2">2</label>
<label class="scaleItem"><input type="radio" name="scale" value="3">3</label>
<label class="scaleItem"><input type="radio" name="scale" value="4">4</label>
<label class="scaleItem"><input type="radio" name="scale" value="5">5</label>
<label class="scaleItem"><input type="radio" name="scale" value="6">6</label>
<label class="scaleItem"><input type="radio" name="scale" value="7">7</label>
<label class="scaleItem"><input type="radio" name="scale" value="8">8</label>
<label class="scaleItem"><input type="radio" name="scale" value="9">9</label>
<label class="scaleItem"><input type="radio" name="scale" value="10">10</label>

</div>

<textarea id="qualified" placeholder="Why are you qualified?"></textarea>

<textarea id="unavailable" placeholder="Reasons you may miss service"></textarea>

<div id="extraQuestions"></div>

<div class="flex gap-3">

<button type="button" onclick="prevPage()" class="back">Back</button>
<button type="button" onclick="nextPage()" class="next">Next</button>

</div>
</div>

<!-- PAGE 3 -->
<div class="page flex flex-col space-y-4">

<h2 class="font-semibold text-lg">Agreements</h2>

<select id="adminAbuse">
<option>Yes</option>
<option>No</option>
<option>Maybe</option>
</select>

<select id="comfort">
<option>Yes</option>
<option>No</option>
<option>Maybe</option>
</select>

<select id="training">
<option>Yes</option>
<option>No</option>
<option>Maybe</option>
</select>

<select id="tos">
<option>Yes</option>
<option>No</option>
<option>Maybe</option>
</select>

<div class="flex gap-3">

<button type="button" onclick="prevPage()" class="back">Back</button>
<button type="button" onclick="submitForm()" class="next">Submit</button>

</div>

</div>

</div>
</div>
</div>
</div>

<div id="success" class="success">
<div class="successBox">
<div class="text-4xl mb-2">✔</div>
<h2 class="font-bold">Application Submitted</h2>
<p class="text-gray-600 text-sm">Please allow up to 72 hours for review.</p>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDGjPlUQMV9qatW6OKmQVvHbVd04cJWW_c",
authDomain:"jci-applications-data.firebaseapp.com",
projectId:"jci-applications-data",
storageBucket:"jci-applications-data.firebasestorage.app",
messagingSenderId:"60833357371",
appId:"1:60833357371:web:f642720942da9e757ac61e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let page=0;

window.nextPage=function(){
if(page<2){
page++;
update();
}
}

window.prevPage=function(){
if(page>0){
page--;
update();
}
}

function update(){
document.getElementById("slider").style.transform=`translateX(-${page*100}%)`;
document.getElementById("progressBar").style.width=`${(page+1)/3*100}%`;
}

document.querySelectorAll(".scaleItem").forEach(item=>{
item.addEventListener("click",()=>{
document.querySelectorAll(".scaleItem").forEach(i=>i.classList.remove("selected"));
item.classList.add("selected");
});
});

const params=new URLSearchParams(window.location.search);
const rawTeam=params.get("team");

document.getElementById("teamTitle").textContent=
rawTeam?rawTeam+" Application":"Application Form";

window.submitForm=async function(){

const data={
team:rawTeam||"Unknown",
preferredName:document.getElementById("preferredName").value,
gender:document.getElementById("gender").value,
roblox:document.getElementById("roblox").value,
discord:document.getElementById("discord").value,
scale:document.querySelector(".scaleItem.selected input")?.value||"",
qualified:document.getElementById("qualified").value,
unavailable:document.getElementById("unavailable").value,
extra:document.getElementById("extra")?.value||"",
adminAbuse:document.getElementById("adminAbuse").value,
comfort:document.getElementById("comfort").value,
training:document.getElementById("training").value,
tos:document.getElementById("tos").value,
status:"Pending",
submittedAt:new Date()
};

await addDoc(collection(db,"applications"),data);

document.getElementById("success").classList.add("show");

}

</script>

</body>
</html>
