<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>JCI Application</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    font-family: "Montserrat", sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e40af);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 700px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 35px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, .4);
}

/* Inputs */
input, textarea, select {
    width: 100%;
    padding: 16px 16px !important;
    border-radius: 10px !important;
    border: 1px solid #2563eb;
    font-size: 16px !important;
    height: 50px;
    background: #f0f4ff;
    transition: .25s;
}

textarea {
    height: 120px;
    resize: vertical;
}

input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #14b8a6;
    box-shadow: 0 0 10px rgba(20, 184, 166, .35);
}

/* Buttons */
button {
    padding: 12px 0 !important;
    font-size: 15px !important;
    border-radius: 10px !important;
    font-weight: 600;
    transition: .2s;
}

button.next {
    background-color: #14b8a6;
    color: white;
}

button.back {
    background-color: #1e3a8a;
    color: white;
}

/* SLIDER FIX */
.page {
    min-width: 100%;
    flex: 0 0 100%;
}

/* SCALE */
.scale {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 8px;
}

.scaleItem {
    background: #f0f4ff;
    padding: 12px 0;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    font-weight: 600;
    transition: .2s;
    border: 1px solid #2563eb;
}

.scaleItem:hover {
    background: #dbeafe;
}

.scaleItem input {
    display: none;
}

.scaleItem.selected {
    background: #14b8a6;
    border-color: #14b8a6;
    color: white;
}

/* SUCCESS POPUP */
.success {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, .65);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: .3s;
}

.success.show {
    opacity: 1;
    pointer-events: auto;
}

.successBox {
    background: white;
    padding: 40px;
    border-radius: 18px;
    text-align: center;
    animation: pop .4s ease;
}

@keyframes pop {
    from {
        transform: scale(.6);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}
</style>

</head>

<body>

<div class="container">
    <div class="card">

        <h1 id="teamTitle" class="text-2xl font-bold mb-4"></h1>

        <div class="progress mb-4">
            <div id="progressBar" class="h-2 w-1/3 bg-cyan-400 rounded"></div>
        </div>

        <div class="overflow-hidden">
            <div id="slider" class="flex transition-transform duration-500">

                <!-- PAGE 1 -->
                <div class="page flex flex-col space-y-4">
                    <h2 class="font-semibold text-lg">Personal Preferences</h2>

                    <input placeholder="Preferred Name">

                    <select>
                        <option>Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Prefer not to say</option>
                    </select>

                    <input placeholder="Roblox Username (ex: @gabriel_lovesjesus)">
                    <input placeholder="Discord Username (ex: @gabriel_lovesjesus)">

                    <button type="button" onclick="nextPage()" class="next">Next</button>
                </div>

                <!-- PAGE 2 -->
                <div class="page flex flex-col space-y-4">
                    <h2 class="font-semibold text-lg">Main Form</h2>

                    <p class="text-sm">How likely are you able to attend service (1-10)?</p>

                    <div class="scale" id="scaleContainer">
                        <label class="scaleItem"><input type="radio" name="scale" value="1">1</label>
                        <label class="scaleItem"><input type="radio" name="scale" value="2">2</label>
                        <label class="scaleItem"><input type="radio" name="scale" value="3">3</label>
                        <label class="scaleItem"><input type="radio" name="scale" value="4">4</label>
                        <label class="scaleItem"><input type="radio" name="scale" value="5">5</label>
                        <label class="scaleItem"><input type="radio" name="scale" value="6">6</label>
                        <label class="scaleItem"><input type="radio" name="scale" value="7">7</label>
                        <label class="scaleItem"><input type="radio" name="scale" value="8">8</label>
                        <label class="scaleItem"><input type="radio" name="scale" value="9">9</label>
                        <label class="scaleItem"><input type="radio" name="scale" value="10">10</label>
                    </div>

                    <textarea placeholder="Tell us why you feel qualified for this role (2-7 sentences)"></textarea>
                    <textarea placeholder="List all reasons you may not attend service"></textarea>

                    <div id="extraQuestions"></div>

                    <div class="flex gap-3">
                        <button type="button" onclick="prevPage()" class="back">Back</button>
                        <button type="button" onclick="nextPage()" class="next">Next</button>
                    </div>
                </div>

                <!-- PAGE 3 -->
                <div class="page flex flex-col space-y-4">
                    <h2 class="font-semibold text-lg">Agreements</h2>

                    <label>Agree not to abuse admin?</label>
                    <select>
                        <option>Yes</option>
                        <option>No</option>
                        <option>Maybe</option>
                    </select>

                    <label>Comfortable working alone or with others?</label>
                    <select>
                        <option>Yes</option>
                        <option>No</option>
                        <option>Maybe</option>
                    </select>

                    <label>Will attend mandatory training?</label>
                    <select>
                        <option>Yes</option>
                        <option>No</option>
                        <option>Maybe</option>
                    </select>

                    <label>Agree with JCI, Roblox, Discord TOS?</label>
                    <select>
                        <option>Yes</option>
                        <option>No</option>
                        <option>Maybe</option>
                    </select>

                    <div class="flex gap-3">
                        <button type="button" onclick="prevPage()" class="back">Back</button>
                        <button type="button" onclick="submitForm()" class="next">Submit</button>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<div id="success" class="success">
    <div class="successBox">
        <div class="text-4xl mb-2">✔</div>
        <h2 class="font-bold">Application Submitted</h2>
        <p class="text-gray-600 text-sm">Please allow up to 72 hours for review</p>
    </div>
</div>

<script>
let page = 0
const slider = document.getElementById("slider")
const progress = document.getElementById("progressBar")

function update() {
    slider.style.transform = `translateX(-${page * 100}%)`
    progress.style.width = `${((page + 1) / 3) * 100}%`
}

function nextPage() {
    if (page < 2) {
        page++
        update()
    }
}

function prevPage() {
    if (page > 0) {
        page--
        update()
    }
}

async function submitForm() {
    // Collect all form data
    const data = {
        team: rawTeam || "Unknown",
        preferredName: document.querySelector('input[placeholder="Preferred Name"]').value,
        roblox: document.querySelector('input[placeholder^="Roblox"]').value,
        discord: document.querySelector('input[placeholder^="Discord"]').value,
        scale: document.querySelector('.scaleItem.selected input')?.value || "",
        qualified: document.querySelectorAll('textarea')[0].value,
        unavailable: document.querySelectorAll('textarea')[1].value,
        extra: document.querySelector('#extraQuestions input, #extraQuestions textarea')?.value || "",
        agreements: {
            adminAbuse: document.querySelectorAll('select')[0].value,
            comfort: document.querySelectorAll('select')[1].value,
            training: document.querySelectorAll('select')[2].value,
            TOS: document.querySelectorAll('select')[3].value
        },
        submittedAt: new Date().toISOString()
    }

    try {
        // Send data to npoint
        await fetch('https://api.npoint.io/8c134d701d74f33e8026', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })

        // Show success popup
        document.getElementById("success").classList.add("show")
    } catch (err) {
        alert("Failed to submit application. Try again later.")
        console.error(err)
    }
}

/* SCALE SELECTION */
document.querySelectorAll(".scaleItem").forEach(item => {
    item.addEventListener("click", () => {
        document.querySelectorAll(".scaleItem").forEach(i => i.classList.remove("selected"))
        item.classList.add("selected")
    })
})

/* TEAM-SPECIFIC QUESTIONS */
const params = new URLSearchParams(window.location.search)
const rawTeam = params.get("team")
const team = (rawTeam || "").toLowerCase()

document.getElementById("teamTitle").textContent =
    rawTeam ? `${rawTeam} Application` : "Application Form"

const extra = document.getElementById("extraQuestions")

if (team.includes("security")) {
    extra.innerHTML = `<textarea placeholder="How would you handle a disruptive player during service?"></textarea>`
} else if (team.includes("worship")) {
    extra.innerHTML = `<input placeholder="What instrument or worship role do you serve?">`
} else if (team.includes("production")) {
    extra.innerHTML = `<input placeholder="What production software do you use?">`
} else if (team.includes("creative")) {
    extra.innerHTML = `<textarea placeholder="Describe your building/design experience"></textarea>`
}
</script>

</body>
</html>
